<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>스마트 안내 사이트</title>

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:Pretendard, sans-serif;
    }

    body{
      background:#0f172a;
      color:white;
    }

    header{
      background:#111827;
      padding:20px 8%;
      display:flex;
      justify-content:space-between;
      align-items:center;
      border-bottom:1px solid rgba(255,255,255,0.1);
    }

    .logo{
      font-size:28px;
      font-weight:bold;
      color:#38bdf8;
    }

    nav{
      display:flex;
      gap:20px;
    }

    nav a{
      color:#cbd5e1;
      text-decoration:none;
      transition:0.3s;
    }

    nav a:hover{
      color:#38bdf8;
    }

    .hero{
      height:70vh;
      display:flex;
      flex-direction:column;
      justify-content:center;
      align-items:center;
      text-align:center;

      background:
      linear-gradient(rgba(0,0,0,0.5), rgba(0,0,0,0.7)),
      url('https://images.unsplash.com/photo-1506744038136-46273834b3fb?q=80&w=1400&auto=format&fit=crop');

      background-size:cover;
      background-position:center;
    }

    .hero h1{
      font-size:64px;
      margin-bottom:20px;
    }

    .hero p{
      font-size:20px;
      color:#d1d5db;
    }

    .container{
      padding:80px 8%;
    }

    .section-title{
      font-size:40px;
      margin-bottom:40px;
      color:#38bdf8;
      text-align:center;
    }

    .cards{
      display:grid;
      grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
      gap:24px;
    }

    .card{
      background:#1e293b;
      border-radius:20px;
      overflow:hidden;
      transition:0.3s;
      border:1px solid rgba(255,255,255,0.05);
    }

    .card:hover{
      transform:translateY(-5px);
      border-color:#38bdf8;
    }

    .card img{
      width:100%;
      height:220px;
      object-fit:cover;
    }

    .card-content{
      padding:24px;
    }

    .card-content h3{
      margin-bottom:14px;
      color:#38bdf8;
    }

    .card-content p{
      color:#cbd5e1;
      line-height:1.6;
    }

    .info-box{
      background:#1e293b;
      padding:40px;
      border-radius:20px;
      margin-top:40px;
      line-height:1.8;
      color:#d1d5db;
    }

    footer{
      margin-top:80px;
      padding:30px;
      text-align:center;
      border-top:1px solid rgba(255,255,255,0.08);
      color:#94a3b8;
    }

    @media(max-width:768px){

      .hero h1{
        font-size:42px;
      }

      nav{
        display:none;
      }

    }
  </style>
</head>

<body>

<header>

  <div class="logo">
    스마트 안내
  </div>

  <nav>
    <a href="#guide">안내</a>
    <a href="#place">장소</a>
    <a href="#contact">문의</a>
  </nav>

</header>

<section class="hero">

  <h1>환영합니다</h1>

  <p>
    쉽고 빠르게 정보를 확인하세요
  </p>

</section>

<section class="container" id="guide">

  <h2 class="section-title">
    주요 안내
  </h2>

  <div class="cards">

    <div class="card">

      <img src="https://images.unsplash.com/photo-1494526585095-c41746248156?q=80&w=1200&auto=format&fit=crop">

      <div class="card-content">

        <h3>시설 안내</h3>

        <p>
          다양한 시설 위치와 운영 정보를 제공합니다.
        </p>

      </div>

    </div>

    <div class="card">

      <img src="https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?q=80&w=1200&auto=format&fit=crop">

      <div class="card-content">

        <h3>이용 방법</h3>

        <p>
          방문객을 위한 이용 절차와 규칙 안내.
        </p>

      </div>

    </div>

    <div class="card">

      <img src="https://images.unsplash.com/photo-1522199710521-72d69614c702?q=80&w=1200&auto=format&fit=crop">

      <div class="card-content">

        <h3>교통 정보</h3>

        <p>
          버스, 지하철, 주차장 위치를 확인하세요.
        </p>

      </div>

    </div>

  </div>

</section>

<section class="container" id="place">

  <h2 class="section-title">
    위치 안내
  </h2>

  <div class="info-box">

    주소 : 대한민국 서울특별시<br><br>

    운영 시간 : 오전 9시 ~ 오후 6시<br><br>

    문의 전화 : 010-1234-5678<br><br>

    이메일 : info@example.com

  </div>

</section>

<footer id="contact">
  © 2026 스마트 안내 사이트
</footer>

</body>
</html>
