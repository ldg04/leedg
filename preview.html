<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Index.HI</title>

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:Arial, sans-serif;
    }

    body{
      background:#0f172a;
      color:white;
    }

    header{
      display:flex;
      justify-content:space-between;
      align-items:center;
      padding:24px 10%;
      border-bottom:1px solid rgba(255,255,255,0.1);
    }

    .logo{
      font-size:28px;
      font-weight:bold;
      color:#38bdf8;
    }

    nav a{
      margin-left:24px;
      text-decoration:none;
      color:white;
      transition:0.3s;
    }

    nav a:hover{
      color:#38bdf8;
    }

    .hero{
      min-height:90vh;
      display:flex;
      justify-content:center;
      align-items:center;
      text-align:center;
      flex-direction:column;
      padding:40px;
    }

    .hero h1{
      font-size:64px;
      margin-bottom:20px;
      line-height:1.2;
    }

    .hero p{
      font-size:20px;
      color:#cbd5e1;
      max-width:700px;
      margin-bottom:40px;
    }

    .btn{
      padding:16px 32px;
      background:#38bdf8;
      color:#0f172a;
      border:none;
      border-radius:12px;
      font-size:18px;
      cursor:pointer;
      font-weight:bold;
      transition:0.3s;
    }

    .btn:hover{
      background:white;
    }

    .features{
      padding:100px 10%;
      display:grid;
      grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
      gap:30px;
    }

    .card{
      background:#1e293b;
      padding:30px;
      border-radius:20px;
    }

    .card h3{
      margin-bottom:16px;
      color:#38bdf8;
    }

    footer{
      text-align:center;
      padding:40px;
      color:#94a3b8;
      border-top:1px solid rgba(255,255,255,0.1);
    }
  </style>
</head>

<body>

  <header>
    <div class="logo">Index.HI</div>

    <nav>
      <a href="#">Home</a>
      <a href="#">Features</a>
      <a href="#">About</a>
      <a href="#">Contact</a>
    </nav>
  </header>

  <section class="hero">
    <h1>AI로 만드는<br>미래의 플랫폼</h1>

    <p>
      Index.HI는 빠르고 스마트한 AI 솔루션으로
      당신의 비즈니스를 혁신합니다.
    </p>

    <button class="btn">시작하기</button>
  </section>

  <section class="features">

    <div class="card">
      <h3>빠른 속도</h3>
      <p>최적화된 시스템으로 빠른 사용자 경험 제공</p>
    </div>

    <div class="card">
      <h3>AI 자동화</h3>
      <p>반복 작업을 자동화하여 생산성을 향상</p>
    </div>

    <div class="card">
      <h3>클라우드 기반</h3>
      <p>언제 어디서나 안정적으로 접근 가능</p>
    </div>

  </section>

  <footer>
    © 2026 Index.HI All Rights Reserved.
  </footer>

</body>
</html>
